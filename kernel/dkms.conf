PACKAGE_NAME="predator-mux"
PACKAGE_VERSION="0.1.0"

BUILT_MODULE_NAME[0]="nvmuxk"
DEST_MODULE_LOCATION[0]="/updates"

# $kernelver, not `uname -r`: DKMS builds for every installed kernel, including
# ones that are not booted. gen-symvers.sh has to read the nvidia.ko belonging
# to that kernel, and the Makefile has to pick that kernel's toolchain, so both
# are told which kernel explicitly.
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"

# Off on purpose. An automatic rebuild would silently reload a module whose
# hand-copied RM structs may no longer match a driver that was upgraded in the
# same transaction. nvmuxk checks the driver version itself and refuses on a
# mismatch, but that check happens at insmod, and the point of not
# autoinstalling is that nothing loads it without someone asking.
AUTOINSTALL="no"
